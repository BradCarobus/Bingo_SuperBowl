<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #eee;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 2rem;
      letter-spacing: 0.2em;
    }
    .load-hint {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 1rem;
    }
    .load-hint button {
      background: #333;
      color: #ccc;
      border: 1px solid #555;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      border-radius: 4px;
    }
    .load-hint button:hover { background: #444; }
    .load-hint .btn-shuffle {
      margin-left: 0.5rem;
      background: #e94560;
      color: #fff;
      border-color: #e94560;
    }
    .load-hint .btn-shuffle:hover { background: #c73e54; }
    .board {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: fit-content;
    }
    .board-header {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .board-grid {
      display: grid;
      grid-template-columns: repeat(5, 80px);
      grid-template-rows: repeat(5, 80px);
      gap: 4px;
    }
    .board-header {
      width: fit-content;
    }
    .board-header .cell {
      width: 80px;
      height: 80px;
      font-weight: bold;
      font-size: 1.5rem;
      background: #16213e;
      padding: 0.5rem;
    }
    .cell {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px;
      background: #0f3460;
      border: 2px solid #e94560;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      line-height: 1.2;
      overflow: hidden;
      transition: background 0.15s, transform 0.1s;
    }
    .cell .cell-text {
      width: 100%;
      max-height: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      line-clamp: 4;
      word-break: break-word;
    }
    .cell:hover { background: #1a4a7a; }
    .cell:active { transform: scale(0.98); }
    .cell.marked {
      background: #e94560;
      color: #fff;
      text-decoration: line-through;
    }
    .cell.marked:hover { background: #c73e54; }
    .cell.free {
      background: #16213e;
      cursor: pointer;
      font-weight: bold;
    }
    .cell.free:hover { background: #1e2d4a; }
    .cell.free.highlighted {
      background: #e94560;
      color: #fff;
      border-color: #e94560;
    }
    .cell.free.highlighted:hover { background: #c73e54; }
  </style>
</head>
<body>
  <h1>BINGO</h1>
  <p class="load-hint">
    Edit <code>squares.txt</code> (one line per square, 25 lines). 
    <button type="button" id="loadFile">Load from file</button>
    <button type="button" id="downloadFile">Download .txt</button>
    <button type="button" id="shuffleBtn" class="btn-shuffle">Shuffle</button>
    <button type="button" id="simpleModeBtn">Simple mode</button>
    <input type="file" id="fileInput" accept=".txt" hidden>
  </p>
  <div class="board">
    <div class="board-header">
      <div class="cell">B</div>
      <div class="cell">I</div>
      <div class="cell">N</div>
      <div class="cell">G</div>
      <div class="cell">O</div>
    </div>
    <div class="board-grid" id="squares"></div>
  </div>

  <script>
    const defaultSquares = [
      'Square 1', 'Square 2', 'Square 3', 'Square 4', 'Square 5',
      'Square 6', 'Square 7', 'Square 8', 'Square 9', 'Square 10',
      'Square 11', 'Square 12', 'FREE', 'Square 14', 'Square 15',
      'Square 16', 'Square 17', 'Square 18', 'Square 19', 'Square 20',
      'Square 21', 'Square 22', 'Square 23', 'Square 24', 'Square 25'
    ];

    const STORAGE_KEY = 'bingoState';
    const CENTER_INDEX = 12;

    let labels = [...defaultSquares];
    let displayLabels = [];
    let markedIndices = [];
    let simpleMode = false;
    let freeHighlighted = false;

    function getDisplayText(label) {
      if (!simpleMode) return label;
      const separators = [' – ', ' - ', ' — ', ': '];
      let first = label.length;
      for (const sep of separators) {
        const i = label.indexOf(sep);
        if (i !== -1 && i < first) first = i;
      }
      if (first < label.length) return label.slice(0, first).trim();
      return label;
    }

    function updateSimpleModeBtn() {
      const btn = document.getElementById('simpleModeBtn');
      if (btn) btn.textContent = simpleMode ? 'Simple mode: ON' : 'Simple mode';
    }

    function parseTxt(text) {
      const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      if (lines.length >= 25) return lines.slice(0, 25);
      const out = [...defaultSquares];
      lines.forEach((line, i) => { if (i < 25) out[i] = line; });
      return out;
    }

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildDisplayLabels() {
      const other = [...labels.slice(0, CENTER_INDEX), ...labels.slice(CENTER_INDEX + 1)];
      const shuffled = shuffleArray(other);
      displayLabels = [
        ...shuffled.slice(0, CENTER_INDEX),
        'FREE',
        ...shuffled.slice(CENTER_INDEX)
      ];
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          labels,
          displayLabels,
          markedIndices,
          simpleMode,
          freeHighlighted
        }));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!Array.isArray(data.displayLabels) || data.displayLabels.length !== 25) return null;
        if (!Array.isArray(data.markedIndices)) return null;
        const marked = data.markedIndices.filter(n => typeof n === 'number' && n >= 0 && n < 25 && n !== CENTER_INDEX);
        const loadedLabels = Array.isArray(data.labels) && data.labels.length === 25 ? data.labels : null;
        return {
          labels: loadedLabels,
          displayLabels: data.displayLabels,
          markedIndices: marked,
          simpleMode: data.simpleMode === true,
          freeHighlighted: data.freeHighlighted === true
        };
      } catch (e) {
        return null;
      }
    }

    function shuffleBoard() {
      const other = [
        ...displayLabels.slice(0, CENTER_INDEX),
        ...displayLabels.slice(CENTER_INDEX + 1)
      ];
      const shuffled = shuffleArray(other);
      displayLabels = [
        ...shuffled.slice(0, CENTER_INDEX),
        'FREE',
        ...shuffled.slice(CENTER_INDEX)
      ];
      markedIndices = [];
      render();
      saveState();
    }

    function shrinkText(cell) {
      const wrap = cell.querySelector('.cell-text');
      if (!wrap) return;
      let size = 11;
      cell.style.fontSize = size + 'px';
      wrap.style.webkitLineClamp = '4';
      while (size > 7 && wrap.scrollHeight > wrap.clientHeight) {
        size -= 1;
        cell.style.fontSize = size + 'px';
      }
      if (wrap.scrollHeight > wrap.clientHeight) {
        wrap.style.webkitLineClamp = '3';
        while (size > 6 && wrap.scrollHeight > wrap.clientHeight) {
          size -= 1;
          cell.style.fontSize = size + 'px';
        }
      }
    }

    function render() {
      const el = document.getElementById('squares');
      el.innerHTML = '';
      const markedSet = new Set(markedIndices);
      displayLabels.forEach((label, i) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (markedSet.has(i)) cell.classList.add('marked');
        if (i === CENTER_INDEX && freeHighlighted) cell.classList.add('highlighted');
        const textSpan = document.createElement('span');
        textSpan.className = 'cell-text';
        textSpan.textContent = getDisplayText(label);
        cell.appendChild(textSpan);
        cell.dataset.index = i;
        if (i === CENTER_INDEX) cell.classList.add('free');
        cell.addEventListener('click', () => {
          const idx = i;
          if (idx === CENTER_INDEX) {
            freeHighlighted = !freeHighlighted;
            cell.classList.toggle('highlighted', freeHighlighted);
          } else {
            cell.classList.toggle('marked');
            if (markedIndices.includes(idx)) {
              markedIndices = markedIndices.filter(n => n !== idx);
            } else {
              markedIndices = [...markedIndices, idx];
            }
          }
          saveState();
        });
        el.appendChild(cell);
        shrinkText(cell);
      });
    }

    document.getElementById('loadFile').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        labels = parseTxt(r.result);
        buildDisplayLabels();
        markedIndices = [];
        render();
        saveState();
      };
      r.readAsText(file);
      e.target.value = '';
    };

    document.getElementById('shuffleBtn').onclick = shuffleBoard;

    document.getElementById('downloadFile').onclick = () => {
      const text = labels.join('\n');
      const blob = new Blob([text], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'squares.txt';
      a.click();
      URL.revokeObjectURL(url);
    };

    document.getElementById('simpleModeBtn').onclick = () => {
      simpleMode = !simpleMode;
      updateSimpleModeBtn();
      render();
      saveState();
    };

    fetch('squares.txt')
      .then(r => r.ok ? r.text() : Promise.reject())
      .then(text => { labels = parseTxt(text); })
      .catch(() => {})
      .finally(() => {
        const saved = loadState();
        if (saved) {
          if (saved.labels) labels = saved.labels;
          displayLabels = saved.displayLabels;
          markedIndices = saved.markedIndices;
          if (saved.simpleMode) simpleMode = true;
          if (saved.freeHighlighted) freeHighlighted = true;
        } else {
          buildDisplayLabels();
          markedIndices = [];
        }
        render();
        updateSimpleModeBtn();
        saveState();
      });
  </script>
</body>
</html>
